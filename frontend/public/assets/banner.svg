<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2a8a"/>
      <stop offset="1" stop-color="#0b1440"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.5" stop-color="#ffc21a"/>
      <stop offset="1" stop-color="#ff7a00"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd75e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
    </radialGradient>
    <g id="diya">
      <circle cx="0" cy="-30" r="70" fill="url(#glow)"/>
      <path d="M-14,-18 C-14,-44 0,-62 0,-62 C0,-62 14,-44 14,-18 C14,-6 6,0 0,0 C-6,0 -14,-6 -14,-18 Z" fill="url(#flame)"/>
      <path d="M-70,0 H70 C62,38 36,52 0,52 C-36,52 -62,38 -70,0 Z" fill="#f5b700"/>
      <path d="M-70,0 H70 C68,8 66,12 64,16 H-64 C-66,12 -68,8 -70,0 Z" fill="#ffd75e"/>
    </g>
    <g id="spark" fill="#ffd75e">
      <path d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5 Z"/>
    </g>
  </defs>
  <rect width="1080" height="600" fill="url(#bg)"/>
  <use href="#spark" x="120" y="90"/><use href="#spark" x="980" y="120" transform="scale(1)"/>
  <use href="#spark" x="300" y="60"/><use href="#spark" x="780" y="70"/><use href="#spark" x="540" y="40"/>
  <use href="#spark" x="60" y="300"/><use href="#spark" x="1020" y="320"/>
  <text x="540" y="230" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="88" font-weight="700" fill="#ffffff">Happy Diwali</text>
  <text x="540" y="300" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="40" font-weight="600" fill="#ffd75e">Celebrate with vivo</text>
  <use href="#diya" x="260" y="500"/>
  <use href="#diya" x="540" y="520"/>
  <use href="#diya" x="820" y="500"/>
</svg>
